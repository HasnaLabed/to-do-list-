* { box-sizing: border-box; }
html { min-width: 320px; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
.wrap { width: min(1080px, 100% - 40px); margin: 38px auto 28px; }

/* Header */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  margin-bottom: 26px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  border-radius: 15px;
  background: var(--primary);
  color: #fff;
  font-size: 25px; font-weight: 800;
  box-shadow: 0 6px 14px rgba(200, 117, 120, .22);
}
.brand h1 { margin: 0; font-size: 23px; line-height: 1.2; letter-spacing: -.5px; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.date { color: var(--muted); font-size: 13px; text-align: right; }

/* Strawberry hero banner */
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 38px 48px;
  margin-bottom: 20px;
  border: 1px solid #f1d8d0;
  border-radius: 28px;
  background-color: #f9e8df;
  background-image: linear-gradient(rgba(255, 249, 244, .34), rgba(255, 249, 244, .34)), var(--strawberry-bg);
  background-size: auto, 225px auto;
  background-position: center;
  background-repeat: repeat;
  box-shadow: var(--shadow);
}
.hero::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(90deg, rgba(255, 248, 241, .82), rgba(255, 248, 241, .50) 62%, rgba(255, 248, 241, .20));
}
.hero h2 { margin: 0 0 8px; color: #754d40; font-size: clamp(25px, 3vw, 31px); line-height: 1.25; letter-spacing: -.6px; }
.hero p { margin: 0; max-width: 580px; color: #795b50; font-size: 17px; }

/* Summary cards */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat {
  display: flex; flex-direction: column; gap: 5px;
  min-height: 105px; padding: 18px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 17px;
  box-shadow: var(--shadow);
}
.stat span { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat strong { color: var(--ink); font-size: 29px; line-height: 1.2; font-weight: 750; }
.stat:nth-child(2) strong { color: var(--primary-dark); }
.stat:nth-child(3) strong { color: var(--green); }

/* Panels and form */
.panel {
  margin-bottom: 18px;
  padding: 23px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 19px;
  box-shadow: var(--shadow);
}
.panel h3 { margin: 0 0 16px; color: var(--ink); font-size: 18px; }
.formgrid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(150px, 1fr) auto; gap: 10px; }
input, select {
  width: 100%; min-width: 0;
  padding: 12px 14px;
  color: var(--ink);
  background: #fffdfc;
  border: 1px solid var(--line);
  border-radius: 11px;
  outline: none;
  transition: border-color .18s ease, box-shadow .18s ease;
}
input::placeholder { color: #b39d95; }
input:focus, select:focus { border-color: #d99a99; box-shadow: 0 0 0 3px rgba(200, 117, 120, .13); }
button {
  border: 0; border-radius: 11px; padding: 11px 17px;
  background: var(--primary); color: #fff;
  font-weight: 700; cursor: pointer;
  transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
}
button:hover { background: var(--primary-dark); box-shadow: 0 5px 12px rgba(169, 87, 96, .16); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid rgba(200, 117, 120, .3); outline-offset: 2px; }
button.secondary { background: var(--primary-soft); color: var(--primary-dark); }
button.secondary:hover { background: #f5d9d5; }
button.danger { padding: 8px 11px; background: #fff0ef; color: var(--red); }
button.danger:hover { background: #fbe0df; }
button.small { padding: 8px 11px; font-size: 13px; }

/* Filters and search */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 23px 0 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filter {
  padding: 8px 14px;
  color: var(--muted); background: #fff;
  border: 1px solid var(--line); border-radius: 10px;
  font-size: 13px; font-weight: 650;
}
.filter:hover { color: var(--primary-dark); background: var(--surface-soft); box-shadow: none; }
.filter.active { color: var(--primary-dark); background: var(--primary-soft); border-color: #edc9c5; }
.search { width: min(280px, 100%); }

/* Task cards */
.tasklist { display: grid; gap: 10px; }
.task {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: 0 5px 16px rgba(126, 78, 68, .045);
  transition: border-color .18s ease, transform .18s ease;
}
.task:hover { border-color: #e6c2b9; transform: translateY(-1px); }
.check { width: 19px; height: 19px; flex: none; accent-color: var(--green); cursor: pointer; }
.taskmain { flex: 1; min-width: 0; }
.taskname { color: var(--ink); font-weight: 650; overflow-wrap: anywhere; }
.task.done .taskname { color: #aa9a94; text-decoration: line-through; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 5px; color: var(--muted); font-size: 12px; }
.tag { display: inline-flex; align-items: center; border-radius: 30px; padding: 3px 9px; font-size: 11px; font-weight: 750; }
.tag.High { color: #b94f55; background: #ffeded; }
.tag.Medium { color: #a36d24; background: #fff4df; }
.tag.Low { color: #347c61; background: #eaf6ef; }
.actions { display: flex; gap: 7px; flex: none; }
.empty { padding: 34px 14px; color: var(--muted); text-align: center; background: #fffdfc; border: 1px dashed #e8cfc7; border-radius: 15px; }
.footer { padding: 18px 10px 8px; color: #a58e85; font-size: 12px; text-align: center; }

/* Edit dialog */
.modalback { position: fixed; z-index: 10; inset: 0; display: none; place-items: center; padding: 18px; background: rgba(68, 43, 39, .42); backdrop-filter: blur(3px); }
.modalback.show { display: grid; }
.modal { width: min(440px, 100%); padding: 24px; background: #fffaf7; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 20px 60px rgba(65, 39, 35, .2); }
.modal h3 { margin: 0 0 17px; color: var(--ink); }
.modal .formgrid { grid-template-columns: 1fr; }
.modalactions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 15px; }

@media (max-width: 700px) {
  .wrap { width: min(100% - 28px, 560px); margin: 22px auto; }
  .top { align-items: flex-start; }
  .date { max-width: 115px; padding-top: 8px; }
  .hero { min-height: 170px; padding: 30px 25px; border-radius: 22px; background-size: auto, 190px auto; }
  .hero p { font-size: 15px; }
  .stats { gap: 9px; }
  .stat { min-height: 90px; padding: 13px; }
  .stat span { font-size: 11px; }
  .stat strong { font-size: 25px; }
  .panel { padding: 18px; }
  .formgrid { grid-template-columns: 1fr; }
  .formgrid button { width: 100%; }
  .search { width: 100%; max-width: none; }
}
@media (max-width: 430px) {
  .brand h1 { font-size: 20px; }
  .brand p { font-size: 11px; }
  .logo { width: 41px; height: 41px; }
  .date { font-size: 11px; }
  .stats { grid-template-columns: 1fr; }
  .stat { min-height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .stat strong { font-size: 22px; }
  .task { align-items: flex-start; gap: 10px; padding: 13px; }
  .actions { flex-direction: column; }
  .actions button { min-width: 65px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">✓</div>
      <div><h1>Taskly</h1><p>Make space for what matters.</p></div>
    </div>
    <div class="date" id="today"></div>
    <button type="button" id="themeToggle" class="theme-toggle">
  🌙 Dark Mode
</button>
  </header>

  <section class="hero" aria-labelledby="heroTitle">
    <h2 id="heroTitle">Your day, organized.</h2>
    <p>Capture tasks, set priorities, and make steady progress.</p>
  </section>

  <section class="stats" aria-label="Task statistics">
    <div class="stat"><span>Total tasks</span><strong id="total">0</strong></div>
    <div class="stat"><span>Active tasks</span><strong id="active">0</strong></div>
    <div class="stat"><span>Completed</span><strong id="completed">0</strong></div>
  </section>

  <section class="panel">
    <h3>Add a new task</h3>
    <form id="taskForm" class="formgrid">
      <input id="taskInput" maxlength="100" placeholder="What do you need to do?" required aria-label="Task name">
      <select id="priorityInput" aria-label="Task priority">
        <option>Medium</option><option>High</option><option>Low</option>
      </select>
      <button type="submit">+ Add task</button>
    </form>
  </section>

  <div class="toolbar">
    <div class="filters" aria-label="Task filters">
      <button type="button" class="filter active" data-filter="all">All</button>
      <button type="button" class="filter" data-filter="active">Active</button>
      <button type="button" class="filter" data-filter="completed">Completed</button>
    </div>
    <input class="search" id="searchInput" placeholder="Search tasks..." aria-label="Search tasks">
  </div>

  <section class="tasklist" id="taskList" aria-live="polite"></section>
  <footer class="footer">Taskly · A little more organized, one task at a time ♡</footer>
</div>

<div class="modalback" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="modal">
    <h3 id="editTitle">Edit task</h3>
    <form id="editForm">
      <div class="formgrid">
        <input id="editName" maxlength="100" required aria-label="Edit task name">
        <select id="editPriority" aria-label="Edit priority">
          <option>High</option><option>Medium</option><option>Low</option>
        </select>
      </div>
      <div class="modalactions">
        <button type="button" class="secondary" id="cancelEdit">Cancel</button>
        <button type="submit">Save changes</button>
      </div>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = "taskly_tasks_v1";
let tasks = loadTasks();
let currentFilter = "all";
let editingId = null;
const $ = id => document.getElementById(id);

function loadTasks() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(saved) ? saved : [];
  } catch {
    return [];
  }
}

function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch {
    alert("Your browser could not save the tasks. Please check your storage settings.");
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[char]));
}

function render() {
  const completedCount = tasks.filter(task => task.completed).length;
  $("total").textContent = tasks.length;
  $("active").textContent = tasks.length - completedCount;
  $("completed").textContent = completedCount;

  const query = $("searchInput").value.trim().toLowerCase();
  const shown = tasks.filter(task => {
    const matchesFilter = currentFilter === "all" ||
      (currentFilter === "active" && !task.completed) ||
      (currentFilter === "completed" && task.completed);
    return matchesFilter && task.name.toLowerCase().includes(query);
  });

  $("taskList").innerHTML = shown.length ? shown.map(task => `
    <article class="task ${task.completed ? "done" : ""}">
      <input class="check" type="checkbox" ${task.completed ? "checked" : ""}
        data-action="toggle" data-id="${escapeHTML(task.id)}"
        aria-label="Mark ${escapeHTML(task.name)} as ${task.completed ? "active" : "completed"}">
      <div class="taskmain">
        <div class="taskname">${escapeHTML(task.name)}</div>
        <div class="meta">
          <span class="tag ${escapeHTML(task.priority)}">${escapeHTML(task.priority)} priority</span>
          <span>${task.completed ? "Completed" : "Active"}</span>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="small secondary" data-action="edit" data-id="${escapeHTML(task.id)}">Edit</button>
        <button type="button" class="danger small" data-action="delete" data-id="${escapeHTML(task.id)}">Delete</button>
      </div>
    </article>
  `).join("") : `
    <div class="empty">${tasks.length ? "No matching tasks. Try another search or filter." : "No tasks yet. Add your first task above ♡"}</div>
  `;

  document.querySelectorAll(".filter").forEach(button => {
    button.classList.toggle("active", button.dataset.filter === currentFilter);
  });
}

$("taskForm").addEventListener("submit", event => {
  event.preventDefault();
  const name = $("taskInput").value.trim();
  if (!name) return;

  tasks.unshift({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    name,
    priority: $("priorityInput").value,
    completed: false,
    createdAt: new Date().toISOString()
  });

  saveTasks();
  $("taskInput").value = "";
  $("priorityInput").value = "Medium";
  render();
  $("taskInput").focus();
});

$("taskList").addEventListener("click", event => {
  const control = event.target.closest("[data-action]");
  if (!control) return;

  const id = control.dataset.id;
  const task = tasks.find(item => item.id === id);
  if (!task) return;

  if (control.dataset.action === "toggle") {
    task.completed = control.checked;
    saveTasks();
    render();
  }

  if (control.dataset.action === "delete" && confirm("Delete this task?")) {
    tasks = tasks.filter(item => item.id !== id);
    saveTasks();
    render();
  }

  if (control.dataset.action === "edit") {
    editingId = id;
    $("editName").value = task.name;
    $("editPriority").value = task.priority;
    $("editModal").classList.add("show");
    $("editName").focus();
  }
});

$("editForm").addEventListener("submit", event => {
  event.preventDefault();
  const task = tasks.find(item => item.id === editingId);
  const name = $("editName").value.trim();
  if (task && name) {
    task.name = name;
    task.priority = $("editPriority").value;
    saveTasks();
    closeEdit();
    render();
  }
});

function closeEdit() {
  $("editModal").classList.remove("show");
  editingId = null;
}

$("cancelEdit").addEventListener("click", closeEdit);
$("editModal").addEventListener("click", event => {
  if (event.target === $("editModal")) closeEdit();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("editModal").classList.contains("show")) closeEdit();
});
$("searchInput").addEventListener("input", render);
document.querySelector(".filters").addEventListener("click", event => {
  const button = event.target.closest("[data-filter]");
  if (button) {
    currentFilter = button.dataset.filter;
    render();
  }
});

$("today").textContent = new Intl.DateTimeFormat("en", {
  weekday: "long", month: "long", day: "numeric"
}).format(new Date());
render();
</script>
</body>
</html>
